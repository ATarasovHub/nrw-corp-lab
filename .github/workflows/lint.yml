name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 4096
              foreach ($r in $results) {
                  $file = [System.IO.Path]::GetRelativePath($PWD, $r.ScriptPath) -replace '\\', '/'
                  Write-Output "::error file=$file,line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
              }
              throw "PSScriptAnalyzer reported $(@($results).Count) finding(s)."
          }
          Write-Output 'PSScriptAnalyzer: no findings.'

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  packer:
    name: Packer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/packer/windows-server-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Format
        run: packer fmt -check -recursive -diff .

      - name: Init
        env:
          # Authenticated requests avoid GitHub API rate limits when fetching plugins.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .

      - name: Validate
        # Dummy secrets only satisfy required variables; nothing connects to Proxmox.
        run: |
          cp windows-server-2025.pkrvars.hcl.example ci.pkrvars.hcl
          packer validate \
            -var-file=ci.pkrvars.hcl \
            -var proxmox_token=ci-placeholder \
            -var admin_password=ci-placeholder \
            .
