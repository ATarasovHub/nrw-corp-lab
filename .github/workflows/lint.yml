name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # 1.25.0 has a nondeterministic parallel-rule/command-cache crash on this suite.
          # Pin the last stable release until the upstream regression is fixed.
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: Show versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-Module -ListAvailable PSScriptAnalyzer).Version.ToString()

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1
          $results = [System.Collections.Generic.List[object]]::new()
          foreach ($f in $files) {
              Invoke-ScriptAnalyzer -Path $f.FullName -Settings ./PSScriptAnalyzerSettings.psd1 |
                  ForEach-Object { $results.Add($_) }
          }
          if ($results.Count -gt 0) {
              $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 4096
              foreach ($r in $results) {
                  $file = [System.IO.Path]::GetRelativePath($PWD, $r.ScriptPath) -replace '\\', '/'
                  Write-Output "::error file=$file,line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
              }
              throw "PSScriptAnalyzer: $($results.Count) finding(s) in $($files.Count) files."
          }
          Write-Output "PSScriptAnalyzer: no findings in $($files.Count) files."

  pester:
    name: Pester unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Unit'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'TestResults/unit-tests.xml'
          Invoke-Pester -Configuration $config

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  packer:
    name: Packer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/packer/windows-server-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Format
        run: packer fmt -check -recursive -diff .

      - name: Init
        env:
          # Authenticated requests avoid GitHub API rate limits when fetching plugins.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .

      - name: Validate
        # Dummy secrets only satisfy required variables; nothing connects to Proxmox.
        run: |
          cp windows-server-2025.pkrvars.hcl.example ci.pkrvars.hcl
          packer validate \
            -var-file=ci.pkrvars.hcl \
            -var proxmox_token=ci-placeholder \
            -var admin_password=ci-placeholder \
            .
