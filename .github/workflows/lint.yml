name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object Name, Version

      - name: Show versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-Module -ListAvailable PSScriptAnalyzer).Version.ToString()

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # One fresh process per file prevents a PSScriptAnalyzer 1.25 command-cache crash from
          # poisoning later analyses. A hung child is killed and retried with a 30-second bound.
          $files = Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1
          $findingFiles = [System.Collections.Generic.List[string]]::new()
          $crashes = [System.Collections.Generic.List[string]]::new()
          foreach ($f in $files) {
              $relative = [System.IO.Path]::GetRelativePath($PWD, $f.FullName) -replace '\\', '/'
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  $token = [guid]::NewGuid().ToString('N')
                  $stdout = Join-Path $env:RUNNER_TEMP "$token.out"
                  $stderr = Join-Path $env:RUNNER_TEMP "$token.err"
                  $arguments = @(
                      '-NoLogo', '-NoProfile', '-File', './.github/scripts/Invoke-AnalyzerFile.ps1'
                      '-Path', $f.FullName, '-Settings', './PSScriptAnalyzerSettings.psd1'
                  )
                  $process = Start-Process -FilePath pwsh -ArgumentList $arguments -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                  $finished = $process.WaitForExit(30000)
                  if (-not $finished) {
                      $process.Kill($true)
                      $exitCode = 3
                      $output = "Analyzer child exceeded 30 seconds."
                  } else {
                      $exitCode = $process.ExitCode
                      $output = @((Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue), (Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue))
                  }
                  Remove-Item -LiteralPath $stdout, $stderr -Force -ErrorAction SilentlyContinue

                  if ($exitCode -eq 0) {
                      break
                  }
                  if ($exitCode -eq 2) {
                      $output | Write-Output
                      $findingFiles.Add($relative)
                      break
                  }
                  Write-Output "Analyzer crash attempt $attempt on $relative."
                  if ($attempt -eq 3) {
                      $crashes.Add($relative)
                      Write-Output "::error file=$relative::PSScriptAnalyzer crashed in three isolated processes."
                      $output | Write-Output
                  }
              }
          }
          if ($findingFiles.Count -gt 0 -or $crashes.Count -gt 0) {
              throw "PSScriptAnalyzer: findings in $($findingFiles.Count) file(s), $($crashes.Count) crash(es) in $($files.Count) files."
          }
          Write-Output "PSScriptAnalyzer: no findings in $($files.Count) files."

  pester:
    name: Pester unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests/Unit'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = 'TestResults/unit-tests.xml'
          Invoke-Pester -Configuration $config

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  packer:
    name: Packer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/packer/windows-server-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Format
        run: packer fmt -check -recursive -diff .

      - name: Init
        env:
          # Authenticated requests avoid GitHub API rate limits when fetching plugins.
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .

      - name: Validate
        # Dummy secrets only satisfy required variables; nothing connects to Proxmox.
        run: |
          cp windows-server-2025.pkrvars.hcl.example ci.pkrvars.hcl
          packer validate \
            -var-file=ci.pkrvars.hcl \
            -var proxmox_token=ci-placeholder \
            -var admin_password=ci-placeholder \
            .
